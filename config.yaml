# Reconciliation pipeline parameters. All thresholds live here, not in code.
input:
  path: data/reconciliation_dataset.xlsx
  internal_sheet: internal_transactions
  provider_sheet: provider_settlement
output_dir: output

matching:
  key_internal: transaction_id
  key_provider: client_reference

# Tolerances: deviations caused by normal provider FX noise (~±0.12%)
amount:
  abs_tolerance_usd: 0.25      # gross difference below max(abs, rel*|gross|) is treated as noise
  rel_tolerance: 0.002
fx:
  rel_tolerance_vs_internal: 0.003   # provider vs internal rate (normal ≤0.12%)
  band_robust_z: 6.0                 # deviation from the currency median rate (MAD-z)
  band_min_rel: 0.005                # ...and at least 0.5%, so noise is not flagged
fee:
  # The provider applies a minimum fee and (at least) two fee tiers.
  tiers: [0.018, 0.010]
  min_fee_usd: 0.05
  tier_rel_tolerance: 0.08           # fee within ±8% of a tier (allowing for rounding to cents)
  rounding_usd: 0.011                # rounding tolerance
  refund_fee_returned: true          # for refunds net = gross + fee (fee is returned) - provider convention
net:
  abs_tolerance_usd: 0.011
timing:
  late_settlement_hours: 96          # normal ≤ ~70h
  in_flight_grace_hours: 96          # COMPLETED without settlement younger than this is still "in flight"
duplicates:
  window_minutes: 10                 # possible double-charge signal inside the ledger
outliers:
  robust_z_threshold: 3.5            # modified z-score (MAD) on log(|USD|)
  high_value_usd: 1000               # separate policy threshold: always goes to review

severity:
  high_usd: 100                      # exposure ≥ this -> HIGH (for amount-type findings)
