# Параметри reconciliation pipeline. Усі пороги — тут, а не в коді.
input:
  path: data/reconciliation_dataset.xlsx
  internal_sheet: internal_transactions
  provider_sheet: provider_settlement
output_dir: output

matching:
  key_internal: transaction_id
  key_provider: client_reference

# Допуски: відхилення, спричинені нормальним FX-шумом провайдера (~±0.12%)
amount:
  abs_tolerance_usd: 0.25      # розбіжність gross менша за max(abs, rel*|gross|) — шум
  rel_tolerance: 0.002
fx:
  rel_tolerance_vs_internal: 0.003   # provider vs internal rate (норма ≤0.12%)
  band_robust_z: 6.0                 # відхилення від медіани курсу валюти (MAD-z)
  band_min_rel: 0.005                # ...і не менше 0.5% щоб не ловити шум
fee:
  # Провайдер використовує мінімальний fee і (щонайменше) два тарифні тири.
  tiers: [0.018, 0.010]
  min_fee_usd: 0.05
  tier_rel_tolerance: 0.08           # fee в межах ±8% від тира (з урахуванням округлення до центів)
  rounding_usd: 0.011                # допуск на округлення
  refund_fee_returned: true          # для refund net = gross + fee (fee повертається) — конвенція провайдера
net:
  abs_tolerance_usd: 0.011
timing:
  late_settlement_hours: 96          # норма ≤ ~70h
  in_flight_grace_hours: 96          # COMPLETED без settlement молодше цього — ще "в польоті"
duplicates:
  window_minutes: 10                 # ознака можливого double-charge в internal
outliers:
  robust_z_threshold: 3.5            # modified z-score (MAD) на log(|USD|)
  high_value_usd: 1000               # окремий policy-поріг: завжди на review

severity:
  high_usd: 100                      # exposure ≥ → HIGH (для критичних типів)
